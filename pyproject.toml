[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moire-cdw"
version = "0.1.0"
description = "Moiré diffraction peak detection, lattice fitting, and independent calibration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "quantem", "torch>=2.7"]

[project.optional-dependencies]
examples = ["jupyterlab", "nbformat", "nbclient", "ipykernel"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
